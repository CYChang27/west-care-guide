name: 東勢里垃圾車清運班表同步
on:
  workflow_dispatch:
  schedule:
    - cron: '35 19 * * *'
  push:
    paths:
      - 'dongshi-lifehub/scripts/sync_garbage.py'
      - '.github/workflows/dongshi-garbage-sync.yml'
permissions:
  contents: write
jobs:
  sync-garbage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Update official Dongshi Li garbage schedules
        run: python dongshi-lifehub/scripts/sync_garbage.py
      - name: Commit updated timetable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dongshi-lifehub/data/garbage.json
          if ! git diff --staged --quiet; then
            git commit -m "同步東勢里垃圾車官方清運班表"
            git pull --rebase
            git push
          fi
