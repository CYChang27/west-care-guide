name: 東勢里生活通官方資料同步
on:
  workflow_dispatch:
  schedule:
    - cron: '20 */3 * * *'
  push:
    paths:
      - 'dongshi-lifehub/index.html'
      - 'dongshi-lifehub/scripts/**'
      - '.github/workflows/dongshi-lifehub-sync.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data parsers
        run: python -m pip install -r dongshi-lifehub/requirements.txt
      - name: Sync official source data
        run: python dongshi-lifehub/scripts/sync_data.py
      - name: Commit data updates only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dongshi-lifehub/data/status.json
          if ! git diff --staged --quiet; then
            git commit -m "更新東勢里生活資訊來源"
            git push
          fi
